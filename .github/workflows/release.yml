name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Semantic release
        id: semrel
        uses: go-semantic-release/action@v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          allow-initial-development-versions: true
          force-bump-patch-version: true

      - uses: actions/setup-go@v5
        if: steps.semrel.outputs.version != ''
        with:
          go-version-file: go.mod

      - uses: pnpm/action-setup@v4
        if: steps.semrel.outputs.version != ''
        with:
          version: 10

      - uses: actions/setup-node@v4
        if: steps.semrel.outputs.version != ''
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install Wails CLI
        if: steps.semrel.outputs.version != ''
        run: |
          go install github.com/wailsapp/wails/v2/cmd/wails@v2.12.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Build windows/amd64
        if: steps.semrel.outputs.version != ''
        env:
          VERSION: ${{ steps.semrel.outputs.version }}
        run: |
          CGO_ENABLED=0 wails build \
            -platform windows/amd64 \
            -ldflags "-s -w -X main.version=v${VERSION}" \
            -clean

          mv build/bin/self-checkout-pos.exe self-checkout-pos.exe

          GOOS=windows GOARCH=amd64 go build \
            -ldflags="-s -w -X main.version=v${VERSION}" \
            -o self-checkout-pos-updater.exe ./cmd/updater

          sha256sum self-checkout-pos.exe         | awk '{print $1}' > self-checkout-pos.exe.sha256
          sha256sum self-checkout-pos-updater.exe | awk '{print $1}' > self-checkout-pos-updater.exe.sha256

      - name: Build manifest.json
        if: steps.semrel.outputs.version != ''
        env:
          REPO:    ${{ github.repository }}
          VERSION: v${{ steps.semrel.outputs.version }}
        run: |
          base="https://github.com/${REPO}/releases/download/${VERSION}"
          jq -n \
            --arg v  "$VERSION" \
            --arg t  "$(date -u +%FT%TZ)" \
            --arg u  "$base/self-checkout-pos.exe" \
            --arg s  "$base/self-checkout-pos.exe.sha256" \
            --arg uu "$base/self-checkout-pos-updater.exe" \
            --arg us "$base/self-checkout-pos-updater.exe.sha256" \
            '{
              version:              $v,
              released_at:          $t,
              download_url:         $u,
              sha256_url:           $s,
              updater_download_url: $uu,
              updater_sha256_url:   $us
            }' > manifest.json
          cat manifest.json

      - name: Upload release assets
        if: steps.semrel.outputs.version != ''
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION:      v${{ steps.semrel.outputs.version }}
        run: |
          gh release upload "$VERSION" \
            self-checkout-pos.exe         self-checkout-pos.exe.sha256 \
            self-checkout-pos-updater.exe self-checkout-pos-updater.exe.sha256 \
            manifest.json \
            config.example.json

      - name: Append download links to release notes
        if: steps.semrel.outputs.version != ''
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO:         ${{ github.repository }}
          VERSION:      v${{ steps.semrel.outputs.version }}
        run: |
          body=$(gh release view "$VERSION" --json body --jq .body)
          base="https://github.com/${REPO}/releases/download/${VERSION}"
          latest="https://github.com/${REPO}/releases/latest/download"
          {
            printf -- '%s\n\n' "$body"
            printf -- '## Downloads\n\n'
            printf -- '- [self-checkout-pos.exe](%s/self-checkout-pos.exe)\n'                 "$base"
            printf -- '- [self-checkout-pos.exe.sha256](%s/self-checkout-pos.exe.sha256)\n'   "$base"
            printf -- '- [self-checkout-pos-updater.exe](%s/self-checkout-pos-updater.exe)\n' "$base"
            printf -- '- [self-checkout-pos-updater.exe.sha256](%s/self-checkout-pos-updater.exe.sha256)\n' "$base"
            printf -- '- [manifest.json](%s/manifest.json)\n'                                 "$base"
            printf -- '\n'
            printf -- 'Auto-update fetches `%s/manifest.json` on every poll.\n' "$latest"
          } > release-notes.md
          gh release edit "$VERSION" --notes-file release-notes.md
